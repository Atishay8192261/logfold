<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-label="LogFold architecture diagram">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#7c8698"/>
    </marker>
    <style>
      .box{fill:#1f2937;stroke:#374151;stroke-width:1.5;rx:12;}
      .pill{fill:#0f1115;stroke:#6ea8fe;stroke-width:1.5;}
      .t{fill:#e5e7eb;}
      .sub{fill:#9aa3b2;font-size:12px;}
      .acc{fill:#6ea8fe;}
      .lbl{fill:#7c8698;font-size:11px;}
      .edge{stroke:#7c8698;stroke-width:1.5;fill:none;}
    </style>
  </defs>

  <!-- Entry points -->
  <g text-anchor="middle" font-size="13" font-family="ui-monospace, Menlo, Consolas, monospace">
    <rect class="pill" x="120" y="24" width="170" height="38" rx="19"/>
    <text class="acc" x="205" y="48">logfold run</text>
    <rect class="pill" x="375" y="24" width="170" height="38" rx="19"/>
    <text class="acc" x="460" y="48">logfold serve</text>
    <rect class="pill" x="630" y="24" width="170" height="38" rx="19"/>
    <text class="acc" x="715" y="48">logfold scan</text>
  </g>

  <!-- Agent runtime -->
  <rect class="box" x="160" y="112" width="600" height="66" rx="12"/>
  <text class="t" x="460" y="140" text-anchor="middle" font-size="15" font-weight="700">Agent runtime</text>
  <text class="sub" x="460" y="160" text-anchor="middle">ReAct control loop &#183; plan &#8594; act &#8594; observe &#8594; repeat</text>

  <!-- edges from entrypoints to runtime -->
  <path class="edge" d="M205,62 L205,90 L440,90 L440,110" marker-end="url(#arrow)"/>
  <path class="edge" d="M460,62 L460,110" marker-end="url(#arrow)"/>
  <path class="edge" d="M715,62 L715,90 L480,90 L480,110" marker-end="url(#arrow)"/>

  <!-- three pillars -->
  <g>
    <rect class="box" x="60" y="238" width="248" height="78" rx="12"/>
    <text class="t" x="184" y="268" text-anchor="middle" font-size="14" font-weight="700">Reasoner</text>
    <text class="sub" x="184" y="288" text-anchor="middle">model-free heuristic</text>
    <text class="sub" x="184" y="304" text-anchor="middle">or local model (swappable)</text>

    <rect class="box" x="336" y="238" width="248" height="78" rx="12"/>
    <text class="t" x="460" y="268" text-anchor="middle" font-size="14" font-weight="700">Tools</text>
    <text class="sub" x="460" y="288" text-anchor="middle">sandbox jail + allowlist</text>
    <text class="sub" x="460" y="304" text-anchor="middle">read_file &#183; grep &#183; run_cmd &#8230;</text>

    <rect class="box" x="612" y="238" width="248" height="78" rx="12"/>
    <text class="t" x="736" y="268" text-anchor="middle" font-size="14" font-weight="700">Memory</text>
    <text class="sub" x="736" y="288" text-anchor="middle">custom HNSW vector index</text>
    <text class="sub" x="736" y="304" text-anchor="middle">long-term recall</text>
  </g>

  <path class="edge" d="M300,178 L300,214 L184,214 L184,238" marker-end="url(#arrow)"/>
  <path class="edge" d="M460,178 L460,238" marker-end="url(#arrow)"/>
  <path class="edge" d="M620,178 L620,214 L736,214 L736,238" marker-end="url(#arrow)"/>

  <!-- journal + replay -->
  <rect class="box" x="120" y="384" width="330" height="60" rx="12"/>
  <text class="t" x="285" y="410" text-anchor="middle" font-size="14" font-weight="700">Journal</text>
  <text class="sub" x="285" y="428" text-anchor="middle">append-only event log</text>

  <rect class="box" x="500" y="384" width="300" height="60" rx="12"/>
  <text class="t" x="650" y="410" text-anchor="middle" font-size="14" font-weight="700">Replay + live trace</text>
  <text class="sub" x="650" y="428" text-anchor="middle">deterministic replay &#183; SSE</text>

  <text class="lbl" x="360" y="352" text-anchor="middle">every step is an event</text>
  <path class="edge" d="M184,316 L184,360 L260,360 L260,384" marker-end="url(#arrow)"/>
  <path class="edge" d="M460,316 L460,360 L300,360 L300,384" marker-end="url(#arrow)"/>
  <path class="edge" d="M736,316 L736,360 L320,360 L320,384" marker-end="url(#arrow)"/>
  <path class="edge" d="M450,414 L500,414" marker-end="url(#arrow)"/>

  <!-- footer -->
  <text class="sub" x="460" y="486" text-anchor="middle">The same graph engine powers the parallel <tspan font-family="ui-monospace, monospace">scan</tspan> playbook.</text>
  <text class="acc" x="460" y="512" text-anchor="middle" font-size="13" font-weight="700">Zero third-party dependencies &#8212; Go standard library only</text>
</svg>
